spring:
  application:
    name: events
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  web:
    error:
      include-stacktrace: never

server:
  port: ${SERVER_PORT:8080}

app:
  version: "@project.version@"
  pagination:
    default-size: ${APP_PAGINATION_DEFAULT_SIZE:20}
    max-size: ${APP_PAGINATION_MAX_SIZE:100}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
