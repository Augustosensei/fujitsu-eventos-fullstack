<nav class="paginator" aria-label="Paginación">
  <button
    type="button"
    class="button button--secondary paginator__prev"
    [disabled]="isFirst()"
    (click)="pageChange.emit(page() - 1)"
  >
    <svg
      class="icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
    Anterior
  </button>
  <p class="paginator__status" aria-live="polite">Página {{ page() + 1 }} de {{ pageCount() }}</p>
  <button
    type="button"
    class="button button--secondary paginator__next"
    [disabled]="isLast()"
    (click)="pageChange.emit(page() + 1)"
  >
    Siguiente
    <svg
      class="icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="m9 18 6-6-6-6" />
    </svg>
  </button>
</nav>
